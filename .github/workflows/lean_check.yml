name: Verify Lean Formalization

on:
  push:
    branches: [main]
    paths:
      - 'formalization/**'
      - '.github/workflows/lean_check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lake build + source/axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: formalization
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        working-directory: .
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          echo "lean-toolchain: $(cat lean-toolchain)"
          lean --version
          lake --version
      - name: Cache Lake
        uses: actions/cache@v4
        with:
          path: formalization/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('formalization/lean-toolchain', 'formalization/lakefile.toml', 'formalization/lake-manifest.json') }}
          restore-keys: ${{ runner.os }}-lake-
      - name: Pin check
        run: |
          set -euo pipefail
          git diff --exit-code -- lean-toolchain lake-manifest.json
      - name: Build and source audit
        run: |
          set -euo pipefail
          chmod +x scripts/check_all.sh
          ./scripts/check_all.sh
      - name: Axiom audit
        run: |
          set -euo pipefail
          chmod +x scripts/print_axioms.sh
          ./scripts/print_axioms.sh axioms.txt
